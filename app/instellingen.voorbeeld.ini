# PlaylistFlac - instellingen
# Regels die met # beginnen worden genegeerd.

# --- Soulseek -------------------------------------------------------------
# Gebruik liefst een APART Soulseek-account, niet hetzelfde als in SoulseekQt
# of Nicotine+. Twee programma's op hetzelfde account gooien elkaar eruit.
# Een nieuw account maak je door gewoon in te loggen met een nieuwe naam.
soulseek-gebruiker =
soulseek-wachtwoord =

# --- Waar de muziek heen gaat --------------------------------------------
# Elke playlist krijgt hier een eigen submap met de naam van de playlist.
# ~ betekent je gebruikersmap (C:\Users\<jij>).
muziekmap = ~\Music

# ja  = alleen FLAC; nummers zonder FLAC worden overgeslagen (volgende keer
#       opnieuw geprobeerd)
# nee = FLAC als het kan, anders de beste mp3
alleen-flac = ja

# Tim Selector: mp3 in plaats van FLAC, en dan altijd 320 kbps. Lagere of
# onbekende bitrates worden overgeslagen. Staat dit op ja, dan telt
# alleen-flac niet.
tim-selector = nee

# Bestandsnaam: "Artiest - Titel (Extended Mix).flac" (ja) of de originele
# Soulseek-naam (nee)
nette-namen = ja

# --- Welke versie (Extended Mix, Original Mix, Radio Edit, ...) ------------
# vragen      = per nieuw nummer zien welke versies er op Soulseek zijn en
#               kiezen (Enter neemt de voorkeur)
# automatisch = zelfde zoektocht, maar neemt altijd de voorkeur zonder te vragen
# uit         = pak gewoon de versie die qua lengte past bij Spotify
#               (meestal de korte radio-versie)
versie-kiezen = vragen

# Welke versie bovenaan komt, de eerste heeft de meeste voorrang. Is het
# Spotify-nummer een remix ("... - Space 92 Remix"), dan blijft het die remix
# en kiest hij daarbinnen (bijv. "Space 92 Extended Remix").
voorkeur-versie = extended, original, club

# --- Spotify (optioneel) ---------------------------------------------------
# Zonder deze twee werkt het ook, maar dan ziet de tool alleen de EERSTE 100
# nummers van een playlist. Makkelijker invullen: tandwieltje in PlaylistFlac,
# "Spotify koppelen", met uitleg. Daarna daar "Inloggen met Spotify".
# App aanmaken op https://developer.spotify.com/dashboard (redirect-URL
# http://127.0.0.1:48721/callback). Het account van die app moet Premium hebben.
spotify-id =
spotify-secret =

# --- Taal / Language -------------------------------------------------------
# auto = zoals je browser of computer, nl = Nederlands, en = English
taal = auto

# --- Playlists ---------------------------------------------------------------
# Eén per regel. Rechtsklik op de playlist in Spotify > Delen > Link kopiëren.
# Mapnaam zelf kiezen kan met:  Mapnaam = link
# Een CSV-export (bijv. van exportify.app) mag ook: zet dan het pad neer.
[playlists]
# https://open.spotify.com/playlist/37i9dQZF1DXcBWIGoYBM5M
# House Party = https://open.spotify.com/playlist/xxxxxxxxxxxxxxxxxxxxxx
